# =============================================================================
# Render Deployment Configuration
# =============================================================================
# This file configures automatic deployment on Render.com
# See: https://render.com/docs/blueprint-spec
# =============================================================================

services:
  - type: web
    name: agent-transponder
    runtime: python
    region: oregon  # or frankfurt for EU
    plan: free      # upgrade to starter ($7/mo) for no spin-down
    
    # Build configuration
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    
    # Health check
    healthCheckPath: /health
    
    # Environment variables (set in Render dashboard for secrets)
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        sync: false  # Set manually in dashboard
      - key: FATHOM_WEBHOOK_SECRET
        sync: false
      - key: HUBSPOT_ACCESS_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: USER_EMAIL
        sync: false

# Optional: Database (if not using external Neon)
# databases:
#   - name: fathom-crm-db
#     plan: free
#     databaseName: fathom_crm_agent
#     user: fathom_user
